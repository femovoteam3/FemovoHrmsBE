AWSTemplateFormatVersion: '2010-09-09'
Description: FEMOVO HRMS - one EC2 app server, private RDS PostgreSQL, HTTPS through CloudFront.

Parameters:
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  VpcOriginSgId:
    Type: String
    Default: ''
    Description: CloudFront-VPCOrigins-Service-SG in this VPC. It only exists after the VPC origin is created, so it is set on the second deploy.
  AlertEmail:
    Type: String
  AdminEmail:
    Type: String

Conditions:
  AllowCloudFront: !Not [!Equals [!Ref VpcOriginSgId, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: femovo-hrms }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  AppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true # outbound only; the security group admits nothing from the internet
      Tags: [{ Key: Name, Value: femovo-app }]
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  AppDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref AppRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  AppSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnet, RouteTableId: !Ref AppRouteTable }
  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: femovo-db-a }]
  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: femovo-db-b }]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FEMOVO app server. Inbound only from CloudFront VPC origin.
      VpcId: !Ref Vpc
  AppFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowCloudFront
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      SourceSecurityGroupId: !Ref VpcOriginSgId
      Description: CloudFront VPC origin
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FEMOVO database. Inbound only from the app server.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: FEMOVO database login
      GenerateSecretString:
        SecretStringTemplate: '{"username":"femovo_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: FEMOVO JWT signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: FEMOVO first administrator login. Change the password after first sign-in.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"email":"${AdminEmail}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: FEMOVO private database subnets
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '18.6'
      DBName: femovo
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1 # Free plan ceiling; AWS Backup below keeps 14 daily copies
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      Tags: [{ Key: Backup, Value: femovo }]

  ReleaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-releases, Status: Enabled, ExpirationInDays: 60 }

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: femovo-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ReleaseBucket.Arn}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbSecret, !Ref JwtSecret, !Ref AdminSecret]
  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppRole]
  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: AppDefaultRoute
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: t4g.micro
      SubnetId: !Ref AppSubnet
      SecurityGroupIds: [!Ref AppSecurityGroup]
      IamInstanceProfile: !Ref AppInstanceProfile
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: femovo-hrms-app }
        - { Key: Backup, Value: femovo }

  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: femovo-hrms-app
        Arn: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AppInstance}
        HTTPPort: 5000
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: FEMOVO HRMS
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: app
            DomainName: !GetAtt AppInstance.PrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
          Compress: true
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: femovo-hrms
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: backup.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: femovo-hrms-daily
        BackupPlanRule:
          - RuleName: daily-14-days
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(30 20 * * ? *) # 02:00 IST
            StartWindowMinutes: 60
            Lifecycle: { DeleteAfterDays: 14 }
  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: femovo-tagged
        IamRoleArn: !GetAtt BackupRole.Arn
        ListOfTags:
          - { ConditionType: STRINGEQUALS, ConditionKey: Backup, ConditionValue: femovo }

  SpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: ANNUALLY
        BudgetLimit: { Amount: 100, Unit: USD }
        TimePeriod: { Start: '1793491200' } # 2026-11-01
        CostTypes:
          IncludeCredit: false # credits would otherwise hide all spend from the alerts
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 25, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 75, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  SiteUrl: { Value: !Sub 'https://${Distribution.DomainName}' }
  DistributionId: { Value: !Ref Distribution }
  InstanceId: { Value: !Ref AppInstance }
  VpcId: { Value: !Ref Vpc }
  ReleaseBucketName: { Value: !Ref ReleaseBucket }
  DbHost: { Value: !GetAtt Database.Endpoint.Address }
  DbSecretArn: { Value: !Ref DbSecret }
  JwtSecretArn: { Value: !Ref JwtSecret }
  AdminSecretArn: { Value: !Ref AdminSecret }

# Operational Monitoring Recommendations (documentation only; no live resources added/modified):
# 1. Alerting SNS Topic (stack region): Create an AWS::SNS::Topic subscribed to !Ref AlertEmail for infrastructure alarms.
# 2. RDS (db.t4g.micro) Alarms (stack region, Namespace: AWS/RDS, DBInstanceIdentifier: !Ref Database):
#    - CPUUtilization > 80% for 3x300s periods; CPUCreditBalance < 20 (t4g burst exhaustion risk).
#    - FreeStorageSpace < 3221225472 bytes (< 3 GiB of 20 GiB) and DatabaseConnections > 80.
# 3. EC2 (t4g.micro) Alarms (stack region, Namespace: AWS/EC2, InstanceId: !Ref AppInstance):
#    - StatusCheckFailed >= 1 for 2x60s periods (detects instance/OOM stalls); CPUUtilization > 85%.
# 4. CloudFront 5xx Alarm (must be provisioned in us-east-1; CloudFront metrics are Global/us-east-1 only):
#    - Namespace: AWS/CloudFront, MetricName: 5xxErrorRate (DistributionId: !Ref Distribution, Region: Global) > 2% for 2x60s periods.
# 5. Outputs Review: Current outputs expose SiteUrl, DistributionId, InstanceId, VpcId, ReleaseBucketName, DbHost, and Secret ARNs;
#    consider exporting Database identifier (!Ref Database) when provisioning external/CLI CloudWatch alarms.
